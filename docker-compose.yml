# =============================================================================
# Rajahinta.fi — local test/dev data stores
#
# PostgreSQL 16 + TimescaleDB and Redis 7 for the suites that still exercise
# the legacy Postgres path (golden, data-quality, compliance, integration,
# and the legacy browser-E2E harness in tests/e2e-browser/boot-stack.sh;
# scripts/dev-up.sh drives this file). The production stack itself is
# Cloudflare Workers (see ARCHITECTURE.md §8 and infra/environments/) —
# there is no Docker application image anymore.
#
# Usage:
#   docker compose up -d postgres redis   # start just the data stores
#   docker compose down --volumes         # tear down + delete DB/redis data
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + TimescaleDB — primary data store
  #
  # TimescaleDB image (task 8.2, change technical-assessment-remediation):
  # price_observations is a hypertable, so the extension must be preloaded
  # before migrations can run CREATE EXTENSION / create_hypertable.
  # ---------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: rajahinta-postgres
    # The image preloads the extension by default; the explicit flag keeps
    # that guarantee even if the image's bundled config changes.
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rajahinta
      POSTGRES_PASSWORD: rajahinta
      POSTGRES_DB: rajahinta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rajahinta -d rajahinta"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Redis 7 — legacy cache/queue store for the Postgres-path suites
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rajahinta-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
