# =============================================================================
# Development environment — localhost
# =============================================================================
# Loaded by Docker Compose and local dev servers. Secrets come from .env file.
# =============================================================================

environment: development

app:
  host: "0.0.0.0"
  port: 3000
  cors:
    origin: ["http://localhost:5173", "http://localhost:3000"]

database:
  host: localhost
  port: 5432
  name: rajahinta_dev
  user: rajahinta
  # Password via RAJAHINTA_DB_PASSWORD env
  ssl: disable
  pool:
    min: 2
    max: 10
  migrate_on_start: true

redis:
  host: localhost
  port: 6379
  # Password via RAJAHINTA_REDIS_PASSWORD env
  db: 0
  bullmq:
    prefix: "bull:dev"
    default_job_options:
      attempts: 3
      backoff:
        type: exponential
        delay: 1000

log:
  level: debug
  format: pretty  # pretty | json
  otel_enabled: false

# Frontend RUM (Grafana Faro) — PUBLIC client config, not credentials.
# Values are fed to the frontend build as NEXT_PUBLIC_FARO_URL /
# NEXT_PUBLIC_FARO_APP_KEY; NEXT_PUBLIC_* is inlined by `next build`, so
# these are build-time values (runtime vars cannot change them). An empty
# URL keeps local builds a full no-op — the SDK never initializes and no
# dev-machine traffic reaches the collector.
faro:
  url: ""      # placeholder — Grafana Cloud Faro collector URL when wired
  app_key: ""  # placeholder — public config; real value lives in build vars

# Feature-flag system removed (2026-09-07, owner decision): all roadmap
# features ship unconditionally. Rollback is `wrangler rollback`, not flags.

# Dev seed data: small sample set for manual testing
seed:
  enabled: true
  merchants: 5
  products_per_merchant: 20
  rate_snapshots: 3

background_jobs:
  price_refresh_interval: 3600   # 1 hour in dev
  transport_rate_refresh: 7200   # 2 hours
  tax_dataset_review: 86400      # 24 hours