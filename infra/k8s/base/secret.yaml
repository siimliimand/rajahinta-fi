---
# Secret template — replace placeholder values with actual credentials
# via external-secrets, SealedSecrets, or kubectl create secret.
#
# Usage:
#   kubectl create secret generic rajahinta-secret \
#     --namespace rajahinta \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/db' \
#     --from-literal=REDIS_URL='redis://:pass@host:6379/1'
#
# DO NOT commit real secrets to version control.
apiVersion: v1
kind: Secret
metadata:
  name: rajahinta-secret
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/part-of: rajahinta
type: Opaque
stringData:
  DATABASE_URL: "postgresql://rajahinta_app:CHANGEME@db.rajahinta.fi:5432/rajahinta"
  REDIS_URL: "redis://:CHANGEME@redis.rajahinta.fi:6379/1"