---
# Non-sensitive environment variables shared across environments.
# Environment-specific overrides (NODE_ENV, LOG_LEVEL, CORS_ORIGIN, etc.)
# are applied via Kustomize overlay patches.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rajahinta-config
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/part-of: rajahinta
data:
  APP_HOST: "0.0.0.0"
  APP_PORT: "3000"
  # Internal-only Prometheus scrape port (FIX-M metric contract — see
  # infra/monitoring/README.md). Served by a separate listener, never
  # routed through the public Ingress.
  METRICS_PORT: "9464"
  # Distributed tracing (task 6.3): OTLP gateway base URL. Non-sensitive;
  # the auth key travels in rajahinta-secret's OTEL_EXPORTER_OTLP_HEADERS.
  # Unset/empty endpoint in a real environment = tracing cleanly disabled.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""