---
# Freshness alerting rules (task 6.4, change technical-assessment-remediation).
#
# Pages an operator when the freshness invariants the data-quality
# service computes degrade, instead of the degradation being discovered
# by users:
#
#   1. Stale price share — share of audited retail offers whose actual
#      recency status is STALE (price-domain staleness threshold: 24 h,
#      see DEFAULT_STALENESS_THRESHOLDS.price in
#      packages/core-domain/src/reliability/reliability.types.ts).
#   2. Transport offer age — age of the NEWEST transport offer. The
#      transport-domain staleness threshold is 7 days (604 800 s,
#      DEFAULT_STALENESS_THRESHOLDS.transport); when the newest offer is
#      older than that, every offer is stale and transport costs degrade
#      to ESTIMATED/UNAVAILABLE.
#
# Metric contract (exported by the backend — see infra/monitoring/README.md):
#   rajahinta_data_quality_stale_price_share_ratio  gauge  0..1
#   rajahinta_transport_newest_offer_age_seconds    gauge  seconds
#
# Thresholds are explicit and documented in infra/monitoring/README.md;
# change them there and here in one deliberate act.
#
# Deployment note: requires the Prometheus Operator (monitoring.coreos.com/v1
# PrometheusRule CRD) and a Prometheus instance whose ruleSelector matches
# the `release: prometheus` label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rajahinta-freshness
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: rajahinta
    release: prometheus
spec:
  groups:
    - name: rajahinta.freshness
      rules:
        # ── Stale price share (price domain, 24 h staleness threshold) ──
        # Some staleness between hourly ingestion runs is normal; a
        # sustained share above 10 % means ingestion is falling behind
        # across merchants.
        - alert: RajahintaStalePriceShareWarning
          expr: rajahinta_data_quality_stale_price_share_ratio > 0.10
          for: 15m
          labels:
            severity: warning
            app.kubernetes.io/part-of: rajahinta
          annotations:
            summary: "More than 10 % of audited price offers are stale"
            description: >-
              Share of retail offers whose observedAt exceeds the 24 h
              price-domain staleness threshold has been above 10 % for 15
              minutes (current: {{ $value | humanizePercentage }}). Check
              the price-ingestion BullMQ queue and merchant feed health.
            runbook: infra/monitoring/README.md#stale-price-share

        # A sustained share above 25 % means a broad merchant/feed outage
        # — the reference dataset can no longer be presented as current.
        - alert: RajahintaStalePriceShareCritical
          expr: rajahinta_data_quality_stale_price_share_ratio > 0.25
          for: 15m
          labels:
            severity: critical
            app.kubernetes.io/part-of: rajahinta
          annotations:
            summary: "More than 25 % of audited price offers are stale"
            description: >-
              Share of retail offers whose observedAt exceeds the 24 h
              price-domain staleness threshold has been above 25 % for 15
              minutes (current: {{ $value | humanizePercentage }}).
              Broad ingestion outage suspected — page on-call.
            runbook: infra/monitoring/README.md#stale-price-share

        # ── Transport offer age (transport domain, 7-day threshold) ──
        # Early warning two days before the invariant breaks, so a stuck
        # transport-rate-refresh job can be fixed while VERIFIED offers
        # still exist.
        - alert: RajahintaTransportOfferAgeWarning
          expr: rajahinta_transport_newest_offer_age_seconds > 432000
          for: 30m
          labels:
            severity: warning
            app.kubernetes.io/part-of: rajahinta
          annotations:
            summary: "Newest transport offer is older than 5 days"
            description: >-
              Age of the newest transport offer has exceeded 5 days
              (432 000 s) for 30 minutes (current: {{ $value | humanizeDuration }}).
              The 7-day transport freshness threshold is approaching —
              check the transport-rate-refresh worker and carrier source.
            runbook: infra/monitoring/README.md#transport-offer-age

        # The assessment's 7-day threshold: when the NEWEST offer is
        # older than 7 days, no transport offer is fresh and every
        # calculation degrades to estimated transport costs.
        - alert: RajahintaTransportOfferAgeCritical
          expr: rajahinta_transport_newest_offer_age_seconds > 604800
          for: 15m
          labels:
            severity: critical
            app.kubernetes.io/part-of: rajahinta
          annotations:
            summary: "Newest transport offer exceeds the 7-day threshold"
            description: >-
              The newest transport offer is older than 7 days
              (604 800 s) — every transport offer is stale (current age:
              {{ $value | humanizeDuration }}). Transport costs on all
              calculations degrade to ESTIMATED/UNAVAILABLE. Page on-call;
              check the carrier source and transport-rate-refresh queue.
            runbook: infra/monitoring/README.md#transport-offer-age

        # ── Exposure-path canary ──
        # A dead or unwired metric export path must page, not silently
        # show fresh zeros. NOTE: fires until the backend-side /metrics
        # export of the two gauges above lands (see the exposure gap in
        # infra/monitoring/README.md) — deploy together with that change.
        - alert: RajahintaFreshnessMetricsAbsent
          expr: absent(rajahinta_transport_newest_offer_age_seconds) or absent(rajahinta_data_quality_stale_price_share_ratio)
          for: 30m
          labels:
            severity: warning
            app.kubernetes.io/part-of: rajahinta
          annotations:
            summary: "Freshness metrics are not being scraped"
            description: >-
              rajahinta_transport_newest_offer_age_seconds and/or
              rajahinta_data_quality_stale_price_share_ratio have been
              absent for 30 minutes. Either the backend metrics endpoint
              is down or the export wiring is missing — freshness
              alerting is blind until this is resolved.
            runbook: infra/monitoring/README.md#metric-exposure-gap
