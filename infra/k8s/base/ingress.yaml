---
# Ingress for external TLS-terminated access.
# Hostnames are environment-specific (patched via overlays).
# Assumes a cluster issuer (e.g. Let's Encrypt via cert-manager) is configured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rajahinta-backend
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: rajahinta
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "CHANGEME.rajahinta.fi"
      secretName: rajahinta-tls
  rules:
    - host: "CHANGEME.rajahinta.fi"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rajahinta-backend
                port:
                  name: http