---
apiVersion: v1
kind: Service
metadata:
  name: rajahinta-backend
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: rajahinta
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    # Internal Prometheus scrape port (FIX-M). Cluster-internal only:
    # no Ingress route exists for it; consumed by servicemonitor.yaml.
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend