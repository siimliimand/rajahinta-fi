---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rajahinta-backend
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: rajahinta
spec:
  # No spec.replicas: the HPA (hpa.yaml) owns the replica count. Setting
  # it here would be reset by every kubectl apply and fight the autoscaler.
  selector:
    matchLabels:
      app.kubernetes.io/name: rajahinta
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rajahinta
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: rajahinta
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      serviceAccountName: rajahinta-backend
      containers:
        - name: backend
          # Placeholder tag — never a mutable ":latest". The deploy
          # pipeline overwrites it with the immutable commit-SHA tag via
          # `kustomize edit set image` (task 11.1); overlays carry the
          # last-deployed pin so rendered manifests always resolve an
          # immutable tag.
          image: ghcr.io/siimliimand/rajahinta:set-by-deploy-pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            # Internal-only Prometheus scrape endpoint (FIX-M) — see
            # service.yaml and servicemonitor.yaml; not routed by the
            # Ingress.
            - name: metrics
              containerPort: 9464
              protocol: TCP
          envFrom:
            - configMapRef:
                name: rajahinta-config
            - secretRef:
                name: rajahinta-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "256m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30