---
# PodDisruptionBudget (task 11.1): keep at least one backend pod serving
# through voluntary disruptions (node drains, cluster upgrades). The
# production overlay raises minAvailable to 2 for its larger replica
# envelope; staging keeps 1 — with min 2 replicas that still means a
# disruption never takes the API fully offline.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rajahinta-backend
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: rajahinta
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rajahinta
      app.kubernetes.io/component: backend
