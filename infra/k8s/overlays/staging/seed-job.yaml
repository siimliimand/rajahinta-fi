---
# Staging seed Job — populates the staging database with fake/test data.
#
# Lives in the staging overlay (not base/) because production must never
# seed fake data, and kustomize's loader rejects resource files outside
# the overlay root (v5.8 security check — the old ../../base/seed-job.yaml
# reference broke `kustomize build`).
#
# Idempotent: seedStagingDatabase checks for existing rows (by EAN,
# versionLabel, etc.) before inserting. Running the Job multiple times
# is safe — it will skip already-seeded rows.
#
# The Job uses the same image as the backend Deployment but overrides
# the command to run the seed runner script.  DATABASE_URL is sourced
# from the rajahinta-secret Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: rajahinta-staging-seed
  namespace: rajahinta
  labels:
    app.kubernetes.io/name: rajahinta
    app.kubernetes.io/component: seed-job
    app.kubernetes.io/part-of: rajahinta
    app.kubernetes.io/version: staging
spec:
  # Run once per deploy — safe to re-run (idempotent)
  backoffLimit: 2
  # Clean up the Pod after 5 minutes so the cluster isn't littered
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rajahinta
        app.kubernetes.io/component: seed-job
        app.kubernetes.io/part-of: rajahinta
    spec:
      restartPolicy: Never
      serviceAccountName: rajahinta-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: seed
          # Immutable-tag discipline (task 11.1): pinned to the commit SHA
          # by the deploy pipeline (`kustomize edit set image` — the
          # images transformer below rewrites every workload with this
          # image name, this one included).
          image: ghcr.io/siimliimand/rajahinta:set-by-deploy-pipeline
          imagePullPolicy: IfNotPresent
          command:
            - node
            - packages/data-platform/dist/seed/seed-runner.js
          # Strict seed mode: per-version row-count mismatches fail the Job
          # (and thus the staging deploy) instead of warning. See D5.
          env:
            - name: TAX_SEED_STRICT
              value: "1"
          envFrom:
            - configMapRef:
                name: rajahinta-config
            - secretRef:
                name: rajahinta-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]