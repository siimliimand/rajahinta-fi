---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rajahinta

resources:
  - ../../base
  # Staging-only seed Job, local to the overlay: kustomize's strict
  # loader (v5.8+) rejects resource files outside the overlay root.
  - seed-job.yaml

# Immutable image tag pin (task 11.1): the deploy workflow overwrites
# newTag with the commit SHA (`kustomize edit set image`) before
# `kustomize build`, and the images transformer rewrites every workload
# carrying this image name (backend Deployment, migrate + seed Jobs).
# The committed placeholder keeps ad-hoc renders off mutable ":latest".
images:
  - name: ghcr.io/siimliimand/rajahinta
    newTag: set-by-deploy-pipeline

patches:
  # ── resource limits (staging: modest) ──
  # NOTE: no spec.replicas patch — the HPA (base/hpa.yaml, staging
  # envelope min 2 / max 4) owns the replica count.
  - target:
      kind: Deployment
      name: rajahinta-backend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "256m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # ── environment-specific ConfigMap entries ──
  - target:
      kind: ConfigMap
      name: rajahinta-config
    patch: |
      - op: add
        path: /data/NODE_ENV
        value: "staging"
      - op: add
        path: /data/LOG_LEVEL
        value: "info"
      - op: add
        path: /data/CORS_ORIGIN
        value: "https://staging.rajahinta.fi"

  # ── ingress hostname ──
  - target:
      kind: Ingress
      name: rajahinta-backend
    patch: |
      - op: replace
        path: /spec/tls/0/hosts/0
        value: "staging.rajahinta.fi"
      - op: replace
        path: /spec/rules/0/host
        value: "staging.rajahinta.fi"
      - op: replace
        path: /spec/tls/0/secretName
        value: "rajahinta-tls-staging"

commonLabels:
  environment: staging