name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type 'yes' to confirm production deploy"
        required: true
        default: "no"

env:
  CI: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/siimliimand/rajahinta
  # Secrets consumed by this workflow:
  #   KUBE_CONFIG — base64-encoded kubeconfig for production cluster
  # (REGISTRY_TOKEN is an optional fallback — see the GHCR login step.)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Require confirmation
        if: ${{ github.event.inputs.confirm_deploy != 'yes' }}
        run: |
          echo "::error ::Confirmation required — set confirm_deploy to 'yes'"
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -t ${{ env.IMAGE_NAME }}:$SHORT_SHA -t ${{ env.IMAGE_NAME }}:latest .

      - name: Log in to GitHub Container Registry
        # Uses the workflow's GITHUB_TOKEN (granted packages: write above);
        # the repo token can push to the repo owner's GHCR namespace.
        # Fallback: a REGISTRY_TOKEN PAT with write:packages is only needed
        # if the image ever moves to a separate org namespace.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker push ${{ env.IMAGE_NAME }}:$SHORT_SHA
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/kustomize

      - name: Authenticate with cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Set image tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cd infra/k8s/overlays/production
          kustomize edit set image ${{ env.IMAGE_NAME }}:$SHORT_SHA

      - name: Clean up previous migrate Job
        run: |
          # Jobs are immutable — delete before re-creating.
          kubectl delete job rajahinta-migrate \
            -n rajahinta \
            --ignore-not-found \
            --wait

      - name: Run database migrations
        run: |
          # Apply only the migrate Job (identified by component label).
          # ConfigMap/Secret already exist from previous deploys.
          kustomize build infra/k8s/overlays/production \
            | kubectl apply -f- \
              --selector='app.kubernetes.io/component=migrate-job'
          kubectl wait job rajahinta-migrate \
            -n rajahinta \
            --for condition=complete \
            --timeout=300s || {
            echo "::error::Migration Job rajahinta-migrate failed — fetching logs:"
            kubectl logs job/rajahinta-migrate -n rajahinta --tail=50 || true
            exit 1
          }

      - name: Deploy workloads
        run: |
          # Apply all resources (deployment, service, etc.).
          # The migrate Job already exists — kubectl apply with identical
          # spec is a server-side no-op.
          kustomize build infra/k8s/overlays/production | kubectl apply -f-

      - name: Verify production deployment
        run: |
          kubectl rollout status deployment/rajahinta-backend \
            -n rajahinta \
            --timeout=120s
          # No seed Job on production — migrations only, no fake data.