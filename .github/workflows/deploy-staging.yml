# =============================================================================
# Deploy Staging — Cloudflare Workers (migrate-to-cloudflare task 6.5)
#
# A push to `master` produces a green end-to-end staging deploy:
#   migrate → seed (staging only) → deploy → health gate
#
# Spec contract (specs/ci-cd-pipeline): D1 migrations applied to the staging
# database before seed and rollout; official tax versions seeded; API Worker,
# email Worker, and frontend Worker deployed via wrangler; readiness verified
# over HTTP. No Docker/GHCR/kubectl path remains.
#
# REQUIRED GitHub secrets (set once in repo settings — names only, values
# never committed):
#   CLOUDFLARE_API_TOKEN  — Workers deploy + D1/R2/Queues/Email + secrets
#                           management for the staging resources
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account the staging Workers live in
#
# REQUIRED repository variable:
#   STAGING_API_URL — deployed api-worker staging base URL
#                     (e.g. https://rajahinta-api-staging.<subdomain>.workers.dev);
#                     the health gate curls its /api/v1/health/ready
# =============================================================================

name: Deploy Staging

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  # Wrangler reads both natively; never echoed, only passed to the CLI.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Staging deploy (migrate → seed → deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ──────────────────────────────────────────────────────────
      # The api/email Workers are bundled by wrangler itself at deploy time
      # (their `main` points at TS sources); OpenNext is the only step that
      # produces a deploy artifact (apps/frontend/.open-next/).
      - name: Build frontend (OpenNext)
        run: pnpm --filter @rajahinta/frontend run build:worker

      # ── Migrate (before seed and rollout — spec ordering) ─────────────
      # `wrangler d1 migrations apply DB --remote --env staging` over the
      # drizzle-kit migration dir shared by packages/data-platform.
      - name: Apply D1 migrations (staging)
        run: pnpm --filter @rajahinta/api-worker run db:migrate:d1:staging

      # ── Seed (staging only — production is never auto-seeded) ─────────
      # scripts/seed-d1.ts --remote --env staging: idempotent (applies
      # migrations again as a recorded no-op), generates the official tax
      # versions, executes them into D1, and FAILS LOUDLY on verification
      # row-count/version mismatches.
      - name: Seed staging D1 (official tax versions)
        run: pnpm --filter @rajahinta/api-worker run db:seed:d1:staging

      # ── Deploy ─────────────────────────────────────────────────────────
      - name: Deploy API Worker (staging)
        run: pnpm --filter @rajahinta/api-worker exec wrangler deploy --env staging

      - name: Deploy email Worker (staging)
        run: pnpm --filter @rajahinta/email-worker exec wrangler deploy --env staging

      - name: Deploy frontend Worker (staging)
        run: pnpm --filter @rajahinta/frontend exec opennextjs-cloudflare deploy --env staging

      # ── Health gate — the job is green only when staging is ready ──────
      # GET /api/v1/health/ready does a D1 roundtrip + DO ping inside the
      # Worker (design D8); a 200 therefore proves the migrated schema, the
      # seeded data path, and all bindings came up healthy. Bounded: 30
      # attempts × 10 s ≈ 5 min, then the job fails.
      - name: Health gate — staging readiness
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            echo "::error::Repository variable STAGING_API_URL is not set — configure the deployed api-worker staging base URL (e.g. https://rajahinta-api-staging.<subdomain>.workers.dev)."
            exit 1
          fi
          echo "Gating on $STAGING_API_URL/api/v1/health/ready"
          attempt=1
          while [ "$attempt" -le 30 ]; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              --max-time 10 "$STAGING_API_URL/api/v1/health/ready" || true)
            if [ "$code" = "200" ]; then
              echo "Readiness OK on attempt $attempt: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP ${code:-no-response} — retrying in 10 s"
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "::error::staging /api/v1/health/ready did not return 200 within the bounded retry window — failing the deploy job."
          exit 1
