name: Deploy Staging

# Staging cluster is not provisioned yet (KUBE_CONFIG secret unset), so every
# deploy run fails at the first kubectl step. Kubernetes is deferred until
# traffic justifies it. When the cluster exists: set the KUBE_CONFIG secret
# and restore the push trigger, or run manually via workflow_dispatch.
on:
  workflow_dispatch:

env:
  CI: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/siimliimand/rajahinta

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Docker image
        # Immutable tagging (task 11.1): the full commit SHA only — no
        # mutable :latest is built or pushed anywhere in the pipeline.
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        # Uses the workflow's GITHUB_TOKEN (granted packages: write above);
        # the repo token can push to the repo owner's GHCR namespace.
        # Fallback: a REGISTRY_TOKEN PAT with write:packages is only needed
        # if the image ever moves to a separate org namespace.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install kustomize
        run: |
          curl -sLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
          chmod +x /usr/local/bin/kustomize

      - name: Authenticate with cluster
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Set image tag
        # Pins the overlay's committed images entry to this build's SHA.
        # The images transformer rewrites every workload carrying the
        # image name (backend Deployment, migrate + seed Jobs), so the
        # rendered manifests resolve immutable tags only (task 11.1).
        run: |
          cd infra/k8s/overlays/staging
          kustomize edit set image ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Clean up previous migrate Job
        run: |
          # Jobs are immutable — delete before re-creating.
          kubectl delete job rajahinta-migrate \
            -n rajahinta \
            --ignore-not-found \
            --wait

      - name: Run database migrations
        run: |
          # Apply only the migrate Job (identified by component label).
          # ConfigMap/Secret already exist from previous deploys.
          kustomize build infra/k8s/overlays/staging \
            | kubectl apply -f- \
              --selector='app.kubernetes.io/component=migrate-job'
          kubectl wait job rajahinta-migrate \
            -n rajahinta \
            --for condition=complete \
            --timeout=300s || {
            echo "::error::Migration Job rajahinta-migrate failed — fetching logs:"
            kubectl logs job/rajahinta-migrate -n rajahinta --tail=50 || true
            exit 1
          }

      - name: Clean up previous seed Job
        run: |
          # Jobs are immutable — delete before re-creating.
          # --ignore-not-found handles first-run / already-clean cases.
          kubectl delete job rajahinta-staging-seed \
            -n rajahinta \
            --ignore-not-found \
            --wait

      - name: Deploy workloads
        run: |
          # Apply all resources (deployment, seed-job, service, etc.).
          # The migrate Job already exists — kubectl apply with identical
          # spec is a server-side no-op.
          kustomize build infra/k8s/overlays/staging | kubectl apply -f-

      - name: Wait for seed Job completion
        run: |
          # Idempotent seed Job — safe to re-run (skips already-seeded rows).
          kubectl wait job rajahinta-staging-seed \
            -n rajahinta \
            --for condition=complete \
            --timeout=300s || {
            echo "::error::Seed Job rajahinta-staging-seed failed — fetching logs:"
            kubectl logs job/rajahinta-staging-seed -n rajahinta --tail=50 || true
            exit 1
          }

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/rajahinta-backend \
            -n rajahinta \
            --timeout=120s

      - name: In-process benchmark
        continue-on-error: true
        run: pnpm test:load

      # ── HTTP-level load test ───────────────────────────────────────────
      # Runs the Artillery HTTP suite (ramp 1→50 / steady 50) against the
      # deployed staging endpoint.  NON-BLOCKING until a baseline exists
      # (D5); promote to blocking after the first successful staging run.
      # ───────────────────────────────────────────────────────────────────
      - name: HTTP load test (non-blocking until baseline)
        continue-on-error: true
        env:
          TARGET_URL: https://staging.rajahinta.fi
        run: pnpm load:http