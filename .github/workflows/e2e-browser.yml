# =============================================================================
# E2E browser — Playwright journeys against the real composed stack
#
# Boots the full stack (PostgreSQL 16 + TimescaleDB, Redis 7, Drizzle
# migrations, staging seed + fixture correction, NestJS backend, Next.js
# frontend) via tests/e2e-browser/boot-stack.sh — the same
# script used locally — then runs the four browser journeys: age gate,
# calculator flow, compare sorting, account export.
#
# Nothing is skipped: the suite runs against real docker-compose services
# (postgres+timescaledb, redis) and real dev servers, exactly as locally.
#
# The mobile-viewport journeys (375×667 / 390×844) are a second, separate
# invocation: they exist only as `*.mobile.spec.ts` projects in
# playwright.workers.config.ts (the Workers-stack harness), so the
# workflow runs them with explicit --project filters. That config boots
# its own local Workers stack through Playwright's webServer array — no
# docker, no Cloudflare account, no extra boot step. The legacy
# docker-compose config is decommission-pending (6.7) and gains no
# mobile projects.
# =============================================================================

name: E2E browser

on:
  push:
    branches: [master, 'feature/*']
  pull_request:
    branches: [master]

env:
  CI: true
  NODE_VERSION: '24'
  PNPM_VERSION: '9'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  browser-e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # boot-stack.sh runs the backend and seed from source, which resolve
      # workspace packages through their dist/ entry points — build them
      # first (locally these persist between runs, in CI the runner is
      # fresh).
      - name: Build workspace packages
        run: pnpm --filter "./packages/**" build

      - name: Boot full stack (timescaledb, redis, migrations, seed, backend, frontend)
        run: bash tests/e2e-browser/boot-stack.sh

      - name: Run browser E2E suite
        run: pnpm run test:e2e-browser

      # Separate invocation because the mobile projects live only in the
      # Workers config (legacy is decommission-pending 6.7 and must not
      # gain mobile runs). --project pins the run to the two phone
      # viewports so the config's desktop chromium project is not
      # executed a second time. The config's webServer array boots the
      # Workers stack itself (CI=true forbids reuse), needing nothing the
      # steps above did not already provide.
      - name: Run mobile-viewport E2E journeys (Workers stack, 375px + 390px)
        run: >-
          pnpm exec playwright test
          -c tests/e2e-browser/playwright.workers.config.ts
          --project=mobile-chrome-375
          --project=mobile-chrome-390

      # Homepage pending-state branch (homepage-live-gap-hero 4.3): the
      # journeys above boot the stack WITH the savings-snapshot seed; this
      # invocation re-boots WITHOUT it (E2E_SAVINGS_SNAPSHOT=0 strips the
      # fixture and resets the fetch/ISR caches) so the homepage renders
      # its designed pending state. One mobile project suffices — the
      # pending rendering is viewport-independent — keeping CI minutes
      # near the minimum. CI=true forbids webServer reuse, so this boots
      # a fresh stack of its own.
      - name: Run homepage pending-state journey (Workers stack, unseeded snapshot)
        env:
          E2E_SAVINGS_SNAPSHOT: '0'
        run: >-
          pnpm exec playwright test
          -c tests/e2e-browser/playwright.workers.config.ts
          homepage-flow
          --project=mobile-chrome-375

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            tests/e2e-browser/playwright-report/
            tests/e2e-browser/test-results/
            tests/e2e-browser/playwright-report-workers/
            tests/e2e-browser/test-results-workers/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump stack logs
        if: failure()
        run: |
          for f in /tmp/rajahinta-e2e-browser/backend.log \
                   /tmp/rajahinta-e2e-browser/frontend.log \
                   /tmp/rajahinta-e2e-browser-workers/frontend-build.log; do
            echo "===== $f (tail 100) ====="
            tail -n 100 "$f" || true
          done

      - name: Tear down stack
        if: always()
        run: bash tests/e2e-browser/boot-stack.sh --down
