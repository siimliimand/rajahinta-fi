# =============================================================================
# CI — Continuous integration (push to master or feature/*, PR to master)
#
# Fast-feedback gating pipeline: lint → build (includes typecheck) → unit →
# golden → data-quality → compliance → e2e → ci-pass.
# =============================================================================

name: CI

on:
  push:
    branches: [master, 'feature/*']
  pull_request:
    branches: [master]

# =============================================================================
# Defaults
# =============================================================================
env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs — organized as a DAG so failures gate downstream checks
# =============================================================================
jobs:

  # --------------------------------------------------------------------------
  # Gate: fast static checks — lint runs in parallel with build
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # --------------------------------------------------------------------------
  # Content-policy — validates translation coverage, file patterns, no
  # forbidden phrases, and similar content-level rules.  Fast static check
  # that runs in parallel with lint and build.
  # --------------------------------------------------------------------------
  content-policy:
    name: Content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:content

  # --------------------------------------------------------------------------
  # Build — includes typecheck (tsc during compilation) plus .d.ts generation
  # needed by downstream package tests.  Runs in parallel with lint.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Cache built artifacts for downstream test jobs
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/*/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Unit tests — depends on successful build
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - run: pnpm run test

  # --------------------------------------------------------------------------
  # Golden-dataset tests — loads seed data, validates pre-calculated scenarios
  # --------------------------------------------------------------------------
  golden-dataset:
    name: Golden-dataset
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run golden-dataset tests
        run: bash scripts/test-golden-dataset.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Data-quality checks — schema conformance, null violations
  # --------------------------------------------------------------------------
  data-quality:
    name: Data-quality
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run data-quality checks
        run: bash scripts/test-data-quality.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Compliance checks — audit log structure, calculation traceability
  # --------------------------------------------------------------------------
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run compliance checks
        run: bash scripts/test-compliance.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test
          COMPLIANCE_ENFORCED: true

  # --------------------------------------------------------------------------
  # E2e tests — HTTP-level integration tests against in-memory backend.
  # Runs from source via vitest aliases; no Postgres or build artifacts needed.
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:e2e

  # --------------------------------------------------------------------------
  # Composition smoke test — boots the REAL AppModule (DB faked at repository
  # boundary), asserts port composition, runs one calculate() end-to-end.
  # No Postgres or Redis needed — all data-access ports are in-memory.
  # --------------------------------------------------------------------------
  composition-smoke:
    name: Composition smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run composition smoke test
        run: pnpm vitest run --config apps/backend/tests/composition/vitest.config.ts

  # --------------------------------------------------------------------------
  # Integration test — real-stack through DrizzleTaxRateRepository + Postgres.
  # Applies Drizzle migrations, seeds official tax rules, then calculates
  # through AlcoholExciseService against the real query path.
  # --------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run integration tests
        run: pnpm vitest run --config tests/integration/vitest.config.ts
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Compose smoke — builds the production image through docker-compose, boots
  # the full local stack (Postgres, Redis, backend), and curls
  # /api/v1/health (the real HealthController route). Guards the exact
  # artifact deploy-staging.yml builds; relocated from the deleted legacy
  # deploy.yml, which covered feature-branch pushes.
  # --------------------------------------------------------------------------
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      - name: Start services
        run: docker compose up -d

      - name: Health check
        run: |
          docker compose ps
          docker compose logs --tail=50 app
          if ! curl --fail --silent --show-error \
               --retry 15 --retry-delay 5 --retry-connrefused --retry-all-errors \
               http://localhost:3000/api/v1/health; then
            echo "::error::compose smoke health check failed — app logs follow"
            docker compose logs --tail=80 app
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # Summary — aggregates all results into a single required check
  # --------------------------------------------------------------------------
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - content-policy
      - build
      - unit-tests
      - golden-dataset
      - data-quality
      - compliance
      - e2e-tests
      - composition-smoke
      - integration
      - compose-smoke
    if: always()

    steps:
      - name: Aggregate results
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "content-policy: ${{ needs.content-policy.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "golden-dataset: ${{ needs.golden-dataset.result }}"
          echo "data-quality: ${{ needs.data-quality.result }}"
          echo "compliance: ${{ needs.compliance.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "composition-smoke: ${{ needs.composition-smoke.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "compose-smoke: ${{ needs.compose-smoke.result }}"

          if [ "${{ needs.lint.result }}" = "failure" ] \
            || [ "${{ needs.content-policy.result }}" = "failure" ] \
            || [ "${{ needs.build.result }}" = "failure" ] \
            || [ "${{ needs.unit-tests.result }}" = "failure" ] \
            || [ "${{ needs.golden-dataset.result }}" = "failure" ] \
            || [ "${{ needs.data-quality.result }}" = "failure" ] \
            || [ "${{ needs.compliance.result }}" = "failure" ] \
            || [ "${{ needs.e2e-tests.result }}" = "failure" ] \
            || [ "${{ needs.composition-smoke.result }}" = "failure" ] \
            || [ "${{ needs.integration.result }}" = "failure" ] \
            || [ "${{ needs.compose-smoke.result }}" = "failure" ]; then
            echo "One or more CI checks failed."
            exit 1
          fi
          echo "All CI checks passed."