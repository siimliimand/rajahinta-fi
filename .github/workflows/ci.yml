# =============================================================================
# CI — Continuous integration (push to master or feature/*, PR to master)
#
# Fast-feedback gating pipeline: lint → build (includes typecheck) → unit →
# golden → data-quality → compliance → e2e → d1 → worker checks →
# wrangler config validation → ci-pass.
#
# Cloudflare Workers additions (task 6.5): the D1 suite, the api-worker e2e
# suite, the OpenNext frontend worker build + compile check, and per-worker
# `wrangler deploy --dry-run` validation so a broken wrangler.jsonc fails
# PRs before any deploy workflow can. Independent jobs run in parallel.
# =============================================================================

name: CI

on:
  push:
    branches: [master, 'feature/*']
  pull_request:
    branches: [master]

# =============================================================================
# Defaults
# =============================================================================
env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs — organized as a DAG so failures gate downstream checks
# =============================================================================
jobs:

  # --------------------------------------------------------------------------
  # Gate: fast static checks — lint runs in parallel with build
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # --------------------------------------------------------------------------
  # Content-policy — validates translation coverage, file patterns, no
  # forbidden phrases, and similar content-level rules.  Fast static check
  # that runs in parallel with lint and build.
  # --------------------------------------------------------------------------
  content-policy:
    name: Content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:content

  # --------------------------------------------------------------------------
  # Build — includes typecheck (tsc during compilation) plus .d.ts generation
  # needed by downstream package tests.  Runs in parallel with lint.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Cache built artifacts for downstream test jobs
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/*/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Unit tests — depends on successful build
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - run: pnpm run test

  # --------------------------------------------------------------------------
  # Golden-dataset tests — loads seed data, validates pre-calculated scenarios
  # --------------------------------------------------------------------------
  golden-dataset:
    name: Golden-dataset
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run golden-dataset tests
        run: bash scripts/test-golden-dataset.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Data-quality checks — schema conformance, null violations
  # --------------------------------------------------------------------------
  data-quality:
    name: Data-quality
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run data-quality checks
        run: bash scripts/test-data-quality.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Compliance checks — audit log structure, calculation traceability
  # --------------------------------------------------------------------------
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run compliance checks
        run: bash scripts/test-compliance.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test
          COMPLIANCE_ENFORCED: true

  # --------------------------------------------------------------------------
  # E2e tests — HTTP-level integration tests against in-memory backend.
  # Runs from source via vitest aliases; no Postgres or build artifacts needed.
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:e2e

  # --------------------------------------------------------------------------
  # Composition smoke test — boots the REAL AppModule (DB faked at repository
  # boundary), asserts port composition, runs one calculate() end-to-end.
  # No Postgres or Redis needed — all data-access ports are in-memory.
  # --------------------------------------------------------------------------
  composition-smoke:
    name: Composition smoke
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run composition smoke test
        run: pnpm vitest run --config apps/backend/tests/composition/vitest.config.ts

  # --------------------------------------------------------------------------
  # Integration test — real-stack through DrizzleTaxRateRepository + Postgres.
  # Applies Drizzle migrations, seeds official tax rules, then calculates
  # through AlcoholExciseService against the real query path.
  # --------------------------------------------------------------------------
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        # TimescaleDB image: the migrations create the timescaledb extension
        # and convert price_observations to a hypertable (task 8.2). The
        # image ships the extension and the required shared_preload_libraries.
        image: timescale/timescaledb:2.16.1-pg16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run integration tests
        run: pnpm vitest run --config tests/integration/vitest.config.ts
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test
          TEST_REDIS_URL: redis://localhost:6379

  # --------------------------------------------------------------------------
  # D1 suite (task 2.7) — the real-Postgres integration suites ported onto the
  # node:sqlite D1 harness (committed migrations applied per suite). Runs from
  # workspace TypeScript sources via vitest aliases — no Postgres service and
  # no build artifacts needed, so it runs in parallel with lint/build.
  # --------------------------------------------------------------------------
  d1-tests:
    name: D1 suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:d1

  # --------------------------------------------------------------------------
  # Worker checks — api-worker e2e suite (full createApp() over the fake-D1
  # harness + in-memory DO namespaces) and the OpenNext frontend worker build
  # with a wrangler compile check of its output. Source-driven — runs in
  # parallel with lint/build.
  # --------------------------------------------------------------------------
  worker-checks:
    name: Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: api-worker e2e
        run: pnpm --filter @rajahinta/api-worker run test:e2e

      - name: Frontend worker build (OpenNext)
        run: pnpm --filter @rajahinta/frontend run build:worker

      # Compile check of the built worker against a named environment —
      # bundles .open-next/worker.js + assets with the staging config
      # (offline: --dry-run performs no API calls).
      - name: Frontend worker compile check (wrangler dry-run)
        run: pnpm --filter @rajahinta/frontend exec wrangler deploy --dry-run --env staging --outdir /tmp/frontend-dry-run

  # --------------------------------------------------------------------------
  # Wrangler config validation — `wrangler deploy --dry-run` per Worker per
  # named environment so a malformed wrangler.jsonc (bad binding, broken
  # migrations entry, misplaced key) fails PRs here instead of in a deploy
  # workflow. Offline: dry-run bundles and validates config without API
  # calls; placeholder resource IDs are fine. Independent of build — runs in
  # parallel with lint/build. (The frontend config is validated in
  # worker-checks, after the OpenNext output it points at exists.)
  # --------------------------------------------------------------------------
  wrangler-config:
    name: Wrangler config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: api-worker config dry-run (dev)
        run: pnpm --filter @rajahinta/api-worker exec wrangler deploy --dry-run --env dev --outdir /tmp/api-dry-run-dev

      - name: api-worker config dry-run (staging)
        run: pnpm --filter @rajahinta/api-worker exec wrangler deploy --dry-run --env staging --outdir /tmp/api-dry-run-staging

      - name: api-worker config dry-run (production)
        run: pnpm --filter @rajahinta/api-worker exec wrangler deploy --dry-run --env production --outdir /tmp/api-dry-run-production

      - name: email-worker config dry-run (staging)
        run: pnpm --filter @rajahinta/email-worker exec wrangler deploy --dry-run --env staging --outdir /tmp/email-dry-run-staging

      - name: email-worker config dry-run (production)
        run: pnpm --filter @rajahinta/email-worker exec wrangler deploy --dry-run --env production --outdir /tmp/email-dry-run-production

  # --------------------------------------------------------------------------
  # Summary — aggregates all results into a single required check
  # --------------------------------------------------------------------------
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - content-policy
      - build
      - unit-tests
      - golden-dataset
      - data-quality
      - compliance
      - e2e-tests
      - d1-tests
      - worker-checks
      - wrangler-config
      - composition-smoke
      - integration
    if: always()

    steps:
      - name: Aggregate results
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "content-policy: ${{ needs.content-policy.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "golden-dataset: ${{ needs.golden-dataset.result }}"
          echo "data-quality: ${{ needs.data-quality.result }}"
          echo "compliance: ${{ needs.compliance.result }}"
          echo "e2e-tests: ${{ needs.e2e-tests.result }}"
          echo "d1-tests: ${{ needs.d1-tests.result }}"
          echo "worker-checks: ${{ needs.worker-checks.result }}"
          echo "wrangler-config: ${{ needs.wrangler-config.result }}"
          echo "composition-smoke: ${{ needs.composition-smoke.result }}"
          echo "integration: ${{ needs.integration.result }}"

          if [ "${{ needs.lint.result }}" = "failure" ] \
            || [ "${{ needs.content-policy.result }}" = "failure" ] \
            || [ "${{ needs.build.result }}" = "failure" ] \
            || [ "${{ needs.unit-tests.result }}" = "failure" ] \
            || [ "${{ needs.golden-dataset.result }}" = "failure" ] \
            || [ "${{ needs.data-quality.result }}" = "failure" ] \
            || [ "${{ needs.compliance.result }}" = "failure" ] \
            || [ "${{ needs.e2e-tests.result }}" = "failure" ] \
            || [ "${{ needs.d1-tests.result }}" = "failure" ] \
            || [ "${{ needs.worker-checks.result }}" = "failure" ] \
            || [ "${{ needs.wrangler-config.result }}" = "failure" ] \
            || [ "${{ needs.composition-smoke.result }}" = "failure" ] \
            || [ "${{ needs.integration.result }}" = "failure" ]; then
            echo "One or more CI checks failed."
            exit 1
          fi
          echo "All CI checks passed."