# =============================================================================
# CI — Continuous integration (every push/PR to master)
#
# Fast-feedback gating pipeline: lint → build (includes typecheck) → unit →
# golden → data-quality → compliance → ci-pass.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# =============================================================================
# Defaults
# =============================================================================
env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs — organized as a DAG so failures gate downstream checks
# =============================================================================
jobs:

  # --------------------------------------------------------------------------
  # Gate: fast static checks — lint runs in parallel with build
  # --------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # --------------------------------------------------------------------------
  # Content-policy — validates translation coverage, file patterns, no
  # forbidden phrases, and similar content-level rules.  Fast static check
  # that runs in parallel with lint and build.
  # --------------------------------------------------------------------------
  content-policy:
    name: Content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint:content

  # --------------------------------------------------------------------------
  # Build — includes typecheck (tsc during compilation) plus .d.ts generation
  # needed by downstream package tests.  Runs in parallel with lint.
  # --------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Cache built artifacts for downstream test jobs
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/*/dist/
            packages/*/dist/
          retention-days: 1
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # Unit tests — depends on successful build
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - run: pnpm run test

  # --------------------------------------------------------------------------
  # Golden-dataset tests — loads seed data, validates pre-calculated scenarios
  # --------------------------------------------------------------------------
  golden-dataset:
    name: Golden-dataset
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run golden-dataset tests
        run: bash scripts/test-golden-dataset.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test
          GOLDEN_DATASET_PATH: ./infra/staging-data

  # --------------------------------------------------------------------------
  # Data-quality checks — schema conformance, null violations
  # --------------------------------------------------------------------------
  data-quality:
    name: Data-quality
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run data-quality checks
        run: bash scripts/test-data-quality.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test

  # --------------------------------------------------------------------------
  # Compliance checks — audit log structure, calculation traceability
  # --------------------------------------------------------------------------
  compliance:
    name: Compliance
    runs-on: ubuntu-latest
    needs: [build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rajahinta
          POSTGRES_PASSWORD: rajahinta
          POSTGRES_DB: rajahinta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: .

      - name: Run compliance checks
        run: bash scripts/test-compliance.sh
        env:
          DATABASE_URL: postgresql://rajahinta:rajahinta@localhost:5432/rajahinta_test
          COMPLIANCE_ENFORCED: true

  # --------------------------------------------------------------------------
  # Summary — aggregates all results into a single required check
  # --------------------------------------------------------------------------
  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - content-policy
      - build
      - unit-tests
      - golden-dataset
      - data-quality
      - compliance
    if: always()

    steps:
      - name: Aggregate results
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "content-policy: ${{ needs.content-policy.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "unit-tests: ${{ needs.unit-tests.result }}"
          echo "golden-dataset: ${{ needs.golden-dataset.result }}"
          echo "data-quality: ${{ needs.data-quality.result }}"
          echo "compliance: ${{ needs.compliance.result }}"

          if [ "${{ needs.lint.result }}" = "failure" ] \
            || [ "${{ needs.content-policy.result }}" = "failure" ] \
            || [ "${{ needs.build.result }}" = "failure" ] \
            || [ "${{ needs.unit-tests.result }}" = "failure" ] \
            || [ "${{ needs.golden-dataset.result }}" = "failure" ] \
            || [ "${{ needs.data-quality.result }}" = "failure" ] \
            || [ "${{ needs.compliance.result }}" = "failure" ]; then
            echo "One or more CI checks failed."
            exit 1
          fi
          echo "All CI checks passed."