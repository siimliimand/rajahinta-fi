# =============================================================================
# Three-tier deployment pipeline
#
#   DEV:       push to feature/*  →  build + unit test
#   STAGING:   PR to main          →  full test suite + golden-dataset checks
#   PRODUCTION: tag v* / manual    →  compliance checks + approval gate
# =============================================================================

name: Deploy

on:
  push:
    branches:
      - 'feature/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

# =============================================================================
# Defaults shared by all jobs
# =============================================================================
env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Jobs
# =============================================================================
jobs:

  # --------------------------------------------------------------------------
  # Build + test — shared across all environments
  # --------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test
        env:
          CI: true

      # Store built artifacts for downstream jobs
      - uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: |
            apps/*/dist/
            packages/*/dist/
          retention-days: 3
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # DEV — automatic on feature branch push
  # --------------------------------------------------------------------------
  dev-deploy:
    name: Dev deploy
    needs: [build]
    if: |
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml build
        env:
          COMPOSE_FILE: docker-compose.yml

      - name: Start services
        run: |
          docker compose up -d
          sleep 10

      - name: Health check
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused \
            http://localhost:3000/health

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # STAGING — on PR to main
  # --------------------------------------------------------------------------
  staging-deploy:
    name: Staging deploy (${{ github.event_name }})
    needs: [build]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main')
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging

    env:
      DB_HOST: db.staging.rajahinta.fi
      REDIS_HOST: redis.staging.rajahinta.fi
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Full test suite
        run: pnpm run test -- --coverage
        env:
          CI: true
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}

      - name: Golden-dataset checks
        run: |
          pnpm run test:e2e -- --grep "golden-dataset"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          GOLDEN_DATASET_PATH: ./test/golden-datasets/staging/

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}:staging-latest
          labels:
            environment: staging
            commit: ${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging cluster
        run: |
          # Placeholder: kubectl set image / helm upgrade
          echo "Deploying staging-${{ github.sha }}"
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Smoke test
        run: |
          curl --retry 10 --retry-delay 15 --retry-connrefused \
            https://staging.rajahinta.fi/health

  # --------------------------------------------------------------------------
  # PRODUCTION — tag push or manual trigger with approval gate
  # --------------------------------------------------------------------------
  production-deploy:
    name: Production deploy
    needs: [build, staging-deploy]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rajahinta.fi

    env:
      DB_HOST: db.rajahinta.fi
      REDIS_HOST: redis.rajahinta.fi
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for version tag

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Compliance checks
        run: |
          echo "=== Compliance checks ==="
          echo "Rate versioning: check"
          echo "Calculation explainability: check"
          echo "Audit logging: verify"
          echo "Disclaimer structural presence: verify"
          pnpm run test:compliance
        env:
          CI: true
          COMPLIANCE_ENFORCED: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          labels:
            environment: production
            version: ${{ github.ref_name }}
            commit: ${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run database migrations
        run: |
          echo "Running migrations against production"
          # pnpm run db:migrate:prod
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Deploy to production cluster
        run: |
          echo "Deploying ${{ github.ref_name }} (${{ github.sha }})"
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG_PROD }}

      - name: Post-deploy smoke test
        run: |
          curl --retry 12 --retry-delay 10 --retry-connrefused \
            https://rajahinta.fi/health
          curl --retry 5 --retry-delay 10 \
            https://rajahinta.fi/api/v1/status

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}